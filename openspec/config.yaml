schema: spec-driven
githubCopilot:
  cloudAgent: false

context: |
  DemandFlow es una aplicación web para registrar y consultar la demanda económica de requerimientos de ingeniería Full Stack de tipo Soporte o Feature, con vigencias, tarifas, cálculo en COP, auditoría, filtros y totales. El alcance y las exclusiones del MVP están en README.md y docs/vision.md.
  La línea base funcional y arquitectónica v1.0 está aprobada y se identifica mediante el tag Git v1.0.0-docs. Comprende 8 historias de usuario, 41 reglas RN, 33 reglas RF complementarias y 8 ADR aprobados (ADR-001 a ADR-008). La aprobación del diseño no autoriza la implementación, que requiere autorización expresa separada.
  Las fuentes operativas son docs/requirements/ y docs/architecture/; consultar docs/requirements/functional-requirements.md, docs/requirements/business-rules.md y docs/requirements/traceability-matrix.md para las 74 reglas y su trazabilidad. Respetar los refinamientos aprobados de RN-001 y RN-031. El DOCX de docs/reference/ es evidencia histórica; el texto vigente prevalece sobre los diagramas conceptuales cuando hay precisiones posteriores.
  La arquitectura aceptada es un monolito modular Spring Boot con Java 21 y Maven; PostgreSQL en Docker Compose, Spring Data JPA/Hibernate y Flyway; Spring MVC, Thymeleaf y Bootstrap. Consultar docs/architecture/architecture.md, docs/architecture/data-model.md y los ocho documentos de docs/architecture-decisions/ para decisiones y límites.
  Preservar los snapshots de tarifas, la precisión decimal, la integridad histórica, la auditoría transaccional y las restricciones de concurrencia y persistencia según las fuentes. El MVP opera en entorno local protegido sin autenticación y no debe exponerse públicamente. Aplicar los estándares de docs/engineering/.
  OpenSpec documenta cambios y no sustituye las fuentes aprobadas. Todo cambio de requisitos o ADR aprobados requiere aprobación explícita y trazabilidad; cualquier sustitución de un ADR aceptado requiere un ADR explícito. Resolver conflictos antes de implementar. Seguir la gobernanza y las condiciones de aprobación de ADR-008.
  Los agentes modifican directamente los archivos del repositorio dentro del alcance autorizado; coordinan la escritura y no modifican simultáneamente los mismos archivos. Evitan mostrar archivos completos o resultados extensos en el chat y entregan únicamente resúmenes breves de cambios, verificaciones, incidencias y estado.

rules:
  proposal:
    - Referenciar documentos internos externos al cambio mediante rutas textuales relativas a la raíz del repositorio, sin enlaces cuya validez dependa de la profundidad del artefacto; conservar los enlaces relativos entre artefactos del mismo cambio cuando sigan siendo válidos al archivarlo.
    - Describir problema, alcance, exclusiones, capacidades afectadas y resultado esperado, con referencias a los requisitos, reglas y ADR pertinentes.
    - Identificar impactos, dependencias, riesgos y decisiones pendientes; señalar conflictos con las fuentes para resolución antes de implementar.
    - Respetar la aprobación humana y las condiciones de inicio establecidas en ADR-008; distinguir la línea base aprobada de la autorización separada para implementar.
  specs:
    - Referenciar documentos internos externos al cambio mediante rutas textuales relativas a la raíz del repositorio, sin enlaces cuya validez dependa de la profundidad del artefacto; conservar los enlaces relativos entre artefactos del mismo cambio cuando sigan siendo válidos al archivarlo.
    - Definir requisitos verificables y escenarios de aceptación para el alcance del cambio, incluidos casos límite, errores y concurrencia cuando corresponda.
    - Trazar cada requisito y escenario a las HU y reglas RN y RF aplicables mediante docs/requirements/traceability-matrix.md, sin duplicar el catálogo completo.
    - Preservar los refinamientos de RN-001 y RN-031 y no alterar silenciosamente reglas aprobadas ni ADR aceptados.
  design:
    - Referenciar documentos internos externos al cambio mediante rutas textuales relativas a la raíz del repositorio, sin enlaces cuya validez dependa de la profundidad del artefacto; conservar los enlaces relativos entre artefactos del mismo cambio cuando sigan siendo válidos al archivarlo.
    - Referenciar los ADR y documentos de arquitectura, modelo de datos, seguridad y pruebas pertinentes; justificar las decisiones técnicas y sus consecuencias.
    - Evaluar según el alcance integridad de datos, cálculos, snapshots, auditoría atómica, concurrencia, migraciones, seguridad y despliegue local.
    - Identificar incompatibilidades o cambios de decisiones aceptadas y exigir su resolución y un ADR explícito de sustitución cuando corresponda.
  tasks:
    - Referenciar documentos internos externos al cambio mediante rutas textuales relativas a la raíz del repositorio, sin enlaces cuya validez dependa de la profundidad del artefacto; conservar los enlaces relativos entre artefactos del mismo cambio cuando sigan siendo válidos al archivarlo.
    - Organizar tareas verificables y ordenadas por dependencia, vinculadas a los requisitos, escenarios y decisiones aplicables.
    - Incluir pruebas y verificaciones proporcionales, trazabilidad, seguridad, integridad y revisión de documentación según el alcance y docs/engineering/.
    - No iniciar implementación hasta contar con las aprobaciones y autorizaciones exigidas por ADR-008; detenerse ante conflictos no resueltos.
