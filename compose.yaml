name: demandflow-local

services:
  postgres:
    image: postgres:17.12-trixie
    environment:
      POSTGRES_DB: demandflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${DEMANDFLOW_DB_PORT:-5432}:5432"
    volumes:
      - type: bind
        source: ${DEMANDFLOW_DATA_DIR:-D:/DOCKER_DATA/POSTGRES_DATA}
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
      - ./docker/postgres/10-bootstrap.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
    secrets:
      - postgres_admin_password
      - postgres_migrator_password
      - postgres_runtime_password
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "demandflow"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    restart: "no"

secrets:
  postgres_admin_password:
    file: ${DEMANDFLOW_SECRETS_DIR:-./.secrets}/bootstrap/postgres.password
  postgres_migrator_password:
    file: ${DEMANDFLOW_SECRETS_DIR:-./.secrets}/spring/spring.flyway.password
  postgres_runtime_password:
    file: ${DEMANDFLOW_SECRETS_DIR:-./.secrets}/spring/spring.datasource.password
