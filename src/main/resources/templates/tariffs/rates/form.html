<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mantener tarifa — DemandFlow</title></head>
<body>
<nav th:replace="~{tariffs/fragments :: navigation}"></nav>
<main>
    <h1 th:text="${editing ? 'Corregir tarifa' : 'Crear tarifa'}"></h1>
    <form method="post" th:object="${form}" th:action="${editing} ? @{/tariffs/rates/{id}/edit(id=${rate.id})} : @{/tariffs/rates}">
        <div th:replace="~{tariffs/fragments :: errors}"></div>
        <div th:unless="${editing}">
            <p><label for="periodId">Período</label>
                <select id="periodId" th:field="*{periodId}" required aria-describedby="period-error">
                    <option value="">Selecciona un período</option>
                    <option th:each="period : ${periods}" th:value="${period.id}" th:text="${period.label + (period.active ? '' : ' (Inactivo)')}" th:disabled="${!period.active}"></option>
                </select>
                <span id="period-error" th:if="${#fields.hasErrors('periodId')}">Selecciona una referencia de período válida.</span></p>
            <p><label for="typeId">Tipo</label>
                <select id="typeId" th:field="*{typeId}" required aria-describedby="type-error">
                    <option value="">Selecciona un tipo</option>
                    <option th:each="type : ${types}" th:value="${type.id}" th:text="${type.name}"></option>
                </select>
                <span id="type-error" th:if="${#fields.hasErrors('typeId')}">Selecciona Soporte o Feature.</span></p>
        </div>
        <div th:if="${editing}">
            <dl><dt>Período (inmutable)</dt><dd th:text="${rate.periodLabel}"></dd><dt>Tipo (inmutable)</dt><dd th:text="${rate.typeName}"></dd></dl>
            <input type="hidden" th:field="*{expectedVersion}">
            <p th:if="${#fields.hasErrors('expectedVersion')}" role="alert">La versión falta o no es válida. Recarga el registro.</p>
            <a th:href="@{/tariffs/rates/{id}/edit(id=${rate.id})}">Recargar registro</a>
        </div>
        <p><label for="amountCOP">Valor COP/h</label>
            <input id="amountCOP" type="text" inputmode="decimal" th:field="*{amountCOP}" required aria-describedby="amount-error">
            <span id="amount-error" th:if="${#fields.hasErrors('validAmount')}" th:errors="*{validAmount}"></span></p>
        <button type="submit">Guardar tarifa</button>
        <a th:href="@{/tariffs/rates}">Volver a tarifas</a>
    </form>
</main>
</body>
</html>
