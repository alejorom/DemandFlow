<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{tariffs/fragments :: head('Detalle de tarifa — DemandFlow')}"></head>
<body>
<nav th:replace="~{tariffs/fragments :: navigation}"></nav>
<main id="contenido" class="container pb-5" tabindex="-1">
    <h1 class="mb-4">Detalle de tarifa</h1>
    <dl class="row gy-2 border rounded p-3 mt-3">
        <dt class="col-sm-4">Período</dt><dd class="col-sm-8 text-break"><a class="link-primary rounded focus-ring p-1" th:href="@{/tariffs/periods/{id}(id=${rate.periodId})}" th:text="${rate.periodLabel}"></a></dd>
        <dt class="col-sm-4">Tipo</dt><dd class="col-sm-8 text-break" th:text="${rate.typeName}"></dd>
        <dt class="col-sm-4">Valor COP/h</dt><dd class="col-sm-8 text-break" th:text="${rate.amountCop}"></dd>
        <dt class="col-sm-4">Estado individual</dt><dd class="col-sm-8 text-break" th:text="${rate.active ? 'Activa' : 'Inactiva'}"></dd>
        <dt class="col-sm-4">Estado del período</dt><dd class="col-sm-8 text-break" th:text="${rate.periodActive ? 'Activo' : 'Inactivo'}"></dd>
        <dt class="col-sm-4">Disponibilidad efectiva</dt><dd class="col-sm-8 text-break" th:text="${rate.available ? 'Disponible' : 'No disponible'}"></dd>
    </dl>
    <a class="link-primary rounded focus-ring p-1" th:href="@{/tariffs/rates/{id}/edit(id=${rate.id})}">Corregir valor</a>
    <form class="card card-body shadow-sm my-3" method="post" th:object="${form}" th:action="${rate.active} ? @{/tariffs/rates/{id}/deactivate(id=${rate.id})} : @{/tariffs/rates/{id}/reactivate(id=${rate.id})}">
        <div th:replace="~{tariffs/fragments :: errors}"></div>
        <input type="hidden" th:field="*{expectedVersion}">
        <p class="alert alert-warning" th:if="${#fields.hasErrors('expectedVersion')}" role="alert">La versión falta o no es válida. Recarga el registro.</p>
        <p class="alert alert-warning" th:if="${!rate.active and !rate.periodActive}">El período está inactivo; no se puede reactivar la tarifa.</p>
        <button class="btn btn-primary align-self-start my-2" type="submit" th:disabled="${!rate.active and !rate.periodActive}" th:text="${rate.active ? 'Desactivar tarifa' : 'Reactivar tarifa'}"></button>
    </form>
    <a class="link-primary rounded focus-ring p-1" th:href="@{/tariffs/rates/{id}(id=${rate.id})}">Recargar registro</a>
</main>
</body>
</html>
