<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}"></title>
    <link rel="stylesheet" th:href="@{/vendor/bootstrap/5.3.8/bootstrap.min.css}">
</head>
<body>
<nav th:fragment="navigation" class="border-bottom bg-body-tertiary mb-4" aria-label="Catálogo">
    <a class="visually-hidden-focusable bg-white p-3" href="#contenido">Saltar al contenido</a>
    <div class="container py-3 d-flex flex-column flex-sm-row gap-3 align-items-sm-center">
        <span class="fw-bold">DemandFlow</span>
        <a class="link-primary rounded focus-ring p-1" th:href="@{/tariffs/periods}">Períodos de vigencia</a>
        <a class="link-primary rounded focus-ring p-1" th:href="@{/tariffs/rates}">Tarifas COP/h</a>
    </div>
</nav>
<div th:fragment="errors" class="alert alert-danger" role="alert" th:if="${#fields.hasGlobalErrors()}">
    <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
</div>
</body>
</html>
