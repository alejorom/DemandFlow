spring.config.import=configtree:${DEMANDFLOW_SECRETS_DIR:./.secrets}/spring/
spring.datasource.url=jdbc:postgresql://127.0.0.1:${DEMANDFLOW_DB_PORT:5432}/demandflow?connectTimeout=5&loginTimeout=5&socketTimeout=15&cancelSignalTimeout=2
spring.datasource.username=demandflow_app
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=1
spring.flyway.enabled=true
spring.flyway.url=${spring.datasource.url}
spring.flyway.user=demandflow_migrator
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=infra
spring.flyway.schemas=infra
spring.flyway.create-schemas=false
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=false
spring.flyway.out-of-order=false
spring.flyway.clean-disabled=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.connect-retries=0
spring.flyway.lock-retry-count=3
spring.data.jpa.repositories.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=demandflow
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=never
debug=false
logging.level.com.zaxxer.hikari=OFF
logging.level.org.flywaydb=OFF
logging.level.org.hibernate=OFF
logging.level.org.springframework.orm.jpa=OFF
logging.level.org.springframework.context=ERROR
logging.level.org.springframework.boot.web=ERROR
logging.level.org.springframework.boot.diagnostics.LoggingFailureAnalysisReporter=INFO
